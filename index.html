<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Fran</title>
    <style>
        :root {
            --deep-pink: #ff4d6d;
            --soft-pink: #ffb7c5;
        }

        * { box-sizing: border-box; scroll-behavior: smooth; }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffb7c5 0%, #f8adff 100%);
            font-family: 'Georgia', serif;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Corações de fundo */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(110vh) scale(1); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .btn-open {
            background-color: var(--deep-pink);
            color: white;
            border: none;
            padding: 22px 60px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.4);
            font-weight: bold;
            transition: transform 0.3s;
        }

        .btn-open:hover { transform: scale(1.05); }

        .letter-container {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            position: relative;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp { 
            from { transform: translateY(50px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        .letter {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border-top: 8px solid var(--deep-pink);
            text-align: left;
        }

        .letter-text {
            font-size: 1.1rem;
            color: #333;
            white-space: pre-wrap;
            line-height: 1.8;
            text-align: justify;
        }

        .signature {
            margin-top: 30px;
            font-weight: bold;
            color: var(--deep-pink);
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: none;
        }

        .click-heart {
            position: fixed;
            pointer-events: none;
            animation: popOut 0.8s forwards;
            z-index: 9999;
        }

        @keyframes popOut { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(2) translateY(-50px); opacity: 0; } }
    </style>
</head>
<body onclick="spawnHeart(event)">

    <audio id="myAudio" loop>
        <source src="anjos.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div id="main-content">
            <h1>Carta ❤️</h1>
            <button class="btn-open" id="openBtn" onclick="revealEverything()">Abrir Carta 💌</button>
        </div>

        <div class="letter-container" id="letterContainer">
            <div class="letter">
                <div style="text-align: right; font-style: italic; color: #bbb; margin-bottom: 20px;">1 de janeiro de 2026</div>
                <div class="letter-text" id="typewriter"></div>
                <div class="signature" id="signature">
                    Eu, Miguel, prometo  que eu vou cuidar de cada parte de você delicadamente. ❤️
                </div>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById("myAudio");
        const texto = `Eu te amo, por mais que vários meninos queiram você, algum deles tentou por 4 anos? Algum deles te dava cartas clichê, algum deles já teve que ver o amor da vida do lado de outra pessoa... eu realmente quero você e não quero só ficar pra me achar foda pq eu peguei uma mulher, se eu quisesse não tinha esperado tanto tempo por alguém que eu realmente amasse de vdd sendo que essa pessoa já esteve na minha vida.

Eu sei que eu errei com você em 2023, e foi coisas bestas que fez eu te perder e eu mesmo me perder, eu quero que você seja a mulher da minha vida não só um namorinho de adolescente, quero que dure pra vida, e se você não quiser eu realmente vou respeitar sua opinião e decisão. Você é perfeita e nada tira isso da minha mente, quero te assumir pra minha família te dar flores, beijos e te levar pra viagens em família.

Eu te amo, você é a única pessoa além da minha família que eu falei te amo e eu quero falar mil te amo pq eu realmente te amo. Eu quero concertar tudo que errei, acredito que agora estamos amadurecidos o suficiente. Mas se você for feliz sem mim, eu vou ser feliz por você, então me perdoa pelos meus erros. Te conhecer foi a melhor coisa que aconteceu na minha vida, te amar foi a melhor escolha.

Eu quero que você seja a mãe dos nossos filhos, quero ter um futuro com você e quero ver eles crescerem. Eu vou te esperar, já esperei por 4 anos e já vai fazer 5 anos, mas lembrando claramente que isso é decisão sua, eu quero uma resposta e vou te respeitar independente da decisão.`;

        function revealEverything() {
            // 1. Toca a música (O clique no botão permite isso)
            audio.play().catch(e => console.log("Erro ao tocar:", e));

            // 2. Esconde o botão e mostra a carta
            document.getElementById('openBtn').style.display = 'none';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('letterContainer').style.display = 'block';

            // 3. Efeito de digitação
            let i = 0;
            const container = document.getElementById('typewriter');
            function type() {
                if (i < texto.length) {
                    container.innerHTML += texto.charAt(i);
                    i++;
                    setTimeout(type, 40);
                } else {
                    document.getElementById('signature').style.display = 'block';
                }
            }
            type();
        }

        function spawnHeart(e) {
            const h = document.createElement('div');
            h.innerHTML = '❤️'; h.className = 'click-heart';
            h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 800);
        }

        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 500);
    </script>
</body>
</html>
